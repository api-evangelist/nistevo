name: Nistevo
description: Nistevo was a Collaborative Logistics Network — a web-based, on-demand
  (ASP/SaaS) transportation management platform that let manufacturers, retailers,
  and carriers plan, tender, execute, and settle inbound and outbound truckload freight
  collaboratively. Founded in 1996 in Eden Prairie, Minnesota (originally TransView
  Corporation) and backed by Insight Partners, it served shippers such as General
  Mills, Land O'Lakes, Georgia-Pacific, Cargill, and Baxter, and was acquired by Sterling
  Commerce (an AT&T subsidiary) in May 2006. The company no longer operates independently
  and publishes no public API, developer portal, or documentation; nistevo.com is
  parked and serves no live web application.
